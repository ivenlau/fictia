<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Fictia - AI Novel Writing IDE</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 防闪烁：同步读 localStorage 并上色
      (function () {
        try {
          var raw = localStorage.getItem("fictia.theme") || "mo-ye";
          document.documentElement.dataset.theme = raw;
        } catch (e) {
          document.documentElement.dataset.theme = "mo-ye";
        }
      })();
    </script>
    <style>
      /* 首帧兜底（与墨夜一致，JS 正式主题覆盖） */
      :root {
        --c-bg: 16 16 20;
        --c-text: 244 242 238;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--c-bg));
        color: rgb(var(--c-text));
      }
    </style>
  </head>
  <body class="font-body text-fg-primary bg-surface-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
